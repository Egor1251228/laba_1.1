version: '3.8'

services:
  backend:
    build: ./backend       
    ports:
      - "5000:5000"        
    networks:
      - lab-network        

  frontend:
    build: ./frontend     
    ports:
      - "8080:80"          
    depends_on:
      - backend           
    networks:
      - lab-network

networks:
  lab-network:
    driver: bridge
