version: '3.8'

services:
  # Описываем первый сервис - бэкенд
  backend:
    build: ./backend       # Говорим: "Иди в папку backend и собери образ по Dockerfile оттуда"
    ports:
      - "5000:5000"        # Пробрасываем порты. Слева - порт твоего компа. Справа - порт внутри контейнера.
    networks:
      - lab-network        # Подключаем к общей виртуальной сети

  # Описываем второй сервис - фронтенд
  frontend:
    build: ./frontend      # Иди в папку frontend и собери образ
    ports:
      - "8080:80"          # Nginx внутри работает на 80 порту. Мы будем заходить на 8080 с ноутбука.
    depends_on:
      - backend            # Фронтенд должен запускаться только после бэкенда
    networks:
      - lab-network

# Создаем ту самую виртуальную сеть, чтобы контейнеры видели друг друга
networks:
  lab-network:
    driver: bridge